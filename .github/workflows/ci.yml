name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    name: Lint, format, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Testes unitários
        run: npm run test:unit
      - name: Contrato transacional de publicação
        run: npm run test:publication-db
      - name: Fronteiras de módulo
        run: npm run test:boundaries

  e2e:
    name: Smoke E2E (Electron)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Smoke E2E
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Ausência de secrets em bundle e relatórios E2E
        run: npm run check:sensitive-output

  package:
    name: Empacotamento e integridade do bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      # `npm run build`, não `build:unpacked`: o RF-001-02 fala em pacote
      # instalável, e o `--dir` para antes de gerar os alvos. O build completo
      # produz `release/linux-unpacked` no caminho, então a inspeção continua
      # valendo sobre o mesmo artefato.
      - name: Build empacotado e alvos instaláveis
        run: npm run build
      - name: Inspeção do bundle e fuses
        run: node scripts/inspect-bundle.mjs release/linux-unpacked
      - name: Ausência de secrets no pacote expandido
        run: node scripts/scan-sensitive-output.mjs release/linux-unpacked
      # Um alvo removido da configuração não faria o build falhar; sem esta
      # conferência, o RF-001-02 deixaria de ser exercido em silêncio.
      - name: Alvos instaláveis presentes
        run: ls -1 release/*.AppImage release/*.deb
